name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrintCalc.csproj
      - name: Publish Windows EXE
        run: dotnet publish PrintCalc.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrintCalculator-EXE
          path: bin/Release/net8.0-windows/win-x64/publish/PrintCalc.exe
          if-no-files-found: error
