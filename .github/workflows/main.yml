name: Build EXE and Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows EXE
        run: dotnet publish PrintCalc.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrintCalculator-EXE
          path: bin/Release/net8.0-windows/win-x64/publish/PrintCalc.exe
          if-no-files-found: error

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Setup EXE
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=1.2.0 installer\PrintDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: PrintDesk-Setup
          path: installer-output\PrintDesk-Setup-v1.2.0.exe
          if-no-files-found: error
